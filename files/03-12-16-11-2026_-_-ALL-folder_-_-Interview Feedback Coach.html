<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview Feedback Coach</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--tx:#1c1d26;--mu:#6a6d80;--ac:#5b5bf0;--ok:#1f9d63;--warn:#d98a00;--bad:#d64545;--bd:#e4e5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13141b;--card:#1d1f2a;--tx:#ececf4;--mu:#9a9db3;--ac:#8c8cff;--ok:#43c48a;--warn:#f0b13a;--bad:#ff7070;--bd:#2d2f3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13141b;--card:#1d1f2a;--tx:#ececf4;--mu:#9a9db3;--ac:#8c8cff;--ok:#43c48a;--warn:#f0b13a;--bad:#ff7070;--bd:#2d2f3d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:6px}
select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:170px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 18px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.q{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.meta{color:var(--mu);font-size:.85rem;margin-left:auto}
.score{display:flex;align-items:center;gap:16px}
.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:700;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bd) 0)}
.ring span{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;border-radius:8px}
.line{display:flex;justify-content:space-between;font-size:.92rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{padding:3px 10px;border-radius:99px;font-size:.8rem;border:1px solid var(--bd)}
.chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
ul{padding-left:20px;margin:6px 0}
li{margin-bottom:6px}
h2{font-size:1.05rem;margin:0 0 8px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>Interview Feedback Coach</h1>
  <p class="sub">Practice an answer, get instant feedback on structure, clarity and impact.</p>

  <div class="card">
    <label for="cat">Category</label>
    <select id="cat"></select>
    <div class="row"><p class="q" id="question" style="flex:1;margin:0"></p></div>
    <div class="row"><button class="sec" id="next">Another question</button></div>
  </div>

  <div class="card">
    <label for="ans">Your answer (type or use your keyboard mic)</label>
    <textarea id="ans" placeholder="Answer as you would in the interview…"></textarea>
    <div class="row">
      <button id="timer">Start timer</button>
      <button id="go">Get feedback</button>
      <span class="meta" id="count">0 words · 0:00</span>
    </div>
  </div>

  <div id="out" class="hidden">
    <div class="card score">
      <div class="ring" id="ring"><span id="total">0</span></div>
      <div><h2 id="verdict"></h2><div class="sub" id="pace" style="margin:0"></div></div>
    </div>
    <div class="card"><h2>Breakdown</h2><div id="bars"></div></div>
    <div class="card"><h2>STAR structure</h2><div class="chips" id="star"></div><p class="sub" id="starNote" style="margin:8px 0 0"></p></div>
    <div class="card"><h2>What to improve</h2><ul id="tips"></ul></div>
    <div class="card"><h2>What worked</h2><ul id="good"></ul></div>
  </div>
</main>

<script>
const Q={
 Behavioral:[
  {q:"Tell me about a time you faced a difficult challenge in a team project.",k:["team","challenge","deadline","conflict","bug","learn"]},
  {q:"Describe a situation where you had to learn something quickly.",k:["learn","quickly","tutorial","docs","project","deadline"]},
  {q:"Tell me about a time you made a mistake and how you handled it.",k:["mistake","fix","learn","ownership","prevent","feedback"]}],
 Technical:[
  {q:"Explain the difference between a process and a thread.",k:["memory","shared","context","switch","concurrency","stack"]},
  {q:"How would you design a URL shortener?",k:["hash","database","cache","scale","collision","redirect","api"]},
  {q:"What happens when you type a URL in the browser?",k:["dns","tcp","http","server","render","cache"]}],
 HR:[
  {q:"Tell me about yourself.",k:["student","project","skills","internship","goal","passion"]},
  {q:"Why should we hire you?",k:["skills","value","project","team","learn","contribute"]},
  {q:"Where do you see yourself in five years?",k:["grow","goal","skills","lead","contribute","learn"]}]
};
const $=id=>document.getElementById(id);
const FILLERS=["um","uh","like","basically","actually","literally","you know","kind of","sort of","i guess","stuff","things"];
const HEDGES=["maybe","probably","i think","i guess","perhaps","not sure","i feel like"];
const STAR={
 Situation:["when","while","during","at my","in my","project","team","college","internship","situation","last year","once"],
 Task:["responsible","goal","needed to","had to","my role","task","assigned","objective","aim"],
 Action:["i built","i created","i implemented","i designed","i decided","i wrote","i led","i organized","i fixed","i developed","i started","i used","i analyzed","i added","i proposed"],
 Result:["result","resulted","improved","reduced","increased","achieved","finished","delivered","saved","learned","outcome","successfully","%"]
};
let cur=null,secs=0,tick=null;

function pick(){
  const list=Q[$("cat").value];
  let n;do{n=list[Math.floor(Math.random()*list.length)]}while(list.length>1&&n===cur);
  cur=n;$("question").textContent=n.q;
}
Object.keys(Q).forEach(c=>{const o=document.createElement("option");o.textContent=c;$("cat").appendChild(o)});
$("cat").onchange=pick;$("next").onclick=pick;pick();

const words=t=>(t.toLowerCase().match(/[a-z0-9'’%]+/g)||[]);
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function upd(){$("count").textContent=words($("ans").value).length+" words · "+fmt(secs)}
$("ans").oninput=upd;
$("timer").onclick=()=>{
  if(tick){clearInterval(tick);tick=null;$("timer").textContent="Resume timer";return}
  tick=setInterval(()=>{secs++;upd()},1000);$("timer").textContent="Stop timer";
};
function count(text,list){
  let n=0;const found={};
  list.forEach(f=>{const m=text.match(new RegExp("\\b"+f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","g"));if(m){n+=m.length;found[f]=m.length}});
  return{n,found};
}
function analyze(){
  const raw=$("ans").value.trim();
  if(raw.split(/\s+/).length<8){alert("Write a bit more first (at least a couple of sentences).");return}
  const t=raw.toLowerCase(),w=words(raw),n=w.length;
  const behavioral=$("cat").value==="Behavioral"||$("cat").value==="HR";
  const tips=[],good=[],bars=[];

  // 1. Length
  let len=n<40?30:n<80?65:n<=220?100:n<=300?75:50;
  if(n<80)tips.push("Your answer is short ("+n+" words). Aim for 80–220 words (about 45–90 seconds).");
  else if(n>220)tips.push("Your answer is long ("+n+" words). Trim to the key points so the interviewer stays engaged.");
  else good.push("Good length ("+n+" words).");
  bars.push(["Length",len]);

  // 2. STAR
  const sres={};let hit=0;
  Object.keys(STAR).forEach(k=>{sres[k]=count(t,STAR[k]).n>0;if(sres[k])hit++});
  let st=behavioral?hit*25:Math.max(hit*25,50);
  const miss=Object.keys(sres).filter(k=>!sres[k]);
  if(behavioral){
    if(miss.length)tips.push("Missing STAR parts: "+miss.join(", ")+". Add a sentence for each.");
    else good.push("Covers all four STAR parts.");
  }
  bars.push(["Structure (STAR)",st]);

  // 3. Filler & hedging
  const f=count(t,FILLERS),h=count(t,HEDGES);
  const rate=(f.n+h.n)/n*100;
  let cl=Math.max(0,Math.round(100-rate*14));
  const top=Object.entries({...f.found,...h.found}).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>"“"+e[0]+"” ×"+e[1]).join(", ");
  if(rate>2)tips.push("Cut filler and hedging words ("+top+"). Replace with confident, direct statements.");
  else good.push("Clean delivery with very little filler.");
  bars.push(["Clarity & confidence",cl]);

  // 4. Impact (numbers + strong verbs)
  const nums=(raw.match(/\d+(\.\d+)?\s?%?/g)||[]).length;
  const verbs=count(t,STAR.Action).n;
  let im=Math.min(100,nums*30+verbs*15+(sres.Result?20:0));
  if(nums===0)tips.push("Add at least one number (users, % improvement, time saved, team size) to prove impact.");
  else good.push("Uses measurable details ("+nums+" number"+(nums>1?"s":"")+").");
  if(verbs===0)tips.push("Start action sentences with strong verbs: built, designed, implemented, led.");
  bars.push(["Impact",im]);

  // 5. Ownership
  const I=w.filter(x=>x==="i"||x==="i'm"||x==="i’m"||x==="my").length;
  const we=w.filter(x=>x==="we"||x==="our"||x==="us").length;
  let ow=I+we===0?50:Math.round(I/(I+we)*100);ow=Math.max(40,Math.min(100,ow+20));
  if(we>I*2)tips.push("You say “we” much more than “I”. Clarify what you personally did.");
  else good.push("Clear personal ownership of your contribution.");
  bars.push(["Ownership",ow]);

  // 6. Relevance
  const ks=cur.k,kh=ks.filter(k=>t.includes(k));
  let rel=Math.min(100,Math.round(kh.length/Math.max(3,ks.length-2)*100));
  if(rel<60)tips.push("Stay on topic. Related ideas to mention: "+ks.filter(k=>!kh.includes(k)).slice(0,4).join(", ")+".");
  else good.push("Strong relevance to the question.");
  bars.push(["Relevance",rel]);

  const wts=[.15,.2,.2,.2,.1,.15];
  const total=Math.round(bars.reduce((s,b,i)=>s+b[1]*wts[i],0));
  const col=total>=75?"var(--ok)":total>=50?"var(--warn)":"var(--bad)";

  $("out").classList.remove("hidden");
  $("ring").style.setProperty("--p",total);$("ring").style.setProperty("--c",col);
  $("total").textContent=total;
  $("verdict").textContent=total>=80?"Excellent answer":total>=65?"Good, a few tweaks needed":total>=45?"Decent start, needs work":"Needs a stronger structure";
  if(secs>0){const wpm=Math.round(n/(secs/60));$("pace").textContent="Speaking pace: "+wpm+" words/min"+(wpm>170?" (a bit fast)":wpm<100?" (a bit slow)":" (good)")}
  else $("pace").textContent="Use the timer to also measure speaking pace.";

  $("bars").innerHTML=bars.map(b=>{const c=b[1]>=75?"var(--ok)":b[1]>=50?"var(--warn)":"var(--bad)";
    return '<div class="line"><span>'+b[0]+'</span><b>'+b[1]+'</b></div><div class="bar"><i style="width:'+b[1]+'%;background:'+c+'"></i></div>'}).join("");
  $("star").innerHTML=Object.keys(sres).map(k=>'<span class="chip'+(sres[k]?" on":"")+'">'+k+'</span>').join("");
  $("starNote").textContent=behavioral?"Highlighted parts were detected in your answer.":"STAR matters most for behavioral questions; for technical ones, focus on clarity and depth.";
  $("tips").innerHTML=(tips.length?tips:["Nothing major. Practice again with a new question."]).map(x=>"<li>"+x+"</li>").join("");
  $("good").innerHTML=(good.length?good:["Keep practicing, you will see progress."]).map(x=>"<li>"+x+"</li>").join("");
  $("out").scrollIntoView({behavior:"smooth"});
}
$("go").onclick=analyze;
</script>
</body>
</html>
